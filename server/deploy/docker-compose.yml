# Mindy on one small server (Azure for Students VM, or any Linux box with Docker).
# Caddy gets HTTPS certificates automatically for both domains.
services:
  mindy:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - mindy-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [mindy]
volumes:
  mindy-data:
  caddy-data:
